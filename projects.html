<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Projects</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: #f0f2f5;
}

/* Header */
header {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white;
    text-align: center;
    padding: 30px;
}

/* Navbar */
nav {
    display: flex;
    justify-content: center;
    background: #222;
}

nav a {
    color: white;
    padding: 12px 18px;
    text-decoration: none;
}

nav a:hover {
    background: #00adb5;
}

/* Title */
.title {
    text-align: center;
    margin: 30px 0;
    font-size: 26px;
    color: #333;
}

/* Projects Grid */
.projects {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 20px;
}

/* Card */
.card {
    background: white;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-8px);
}

.card img {
    width: 100%;
    border-radius: 10px;
}

.card h3 {
    margin: 10px 0;
}

.card p {
    color: #555;
    font-size: 14px;
}

/* Button */
.btn {
    display: inline-block;
    margin-top: 10px;
    padding: 8px 12px;
    background: #1e3c72;
    color: white;
    text-decoration: none;
    border-radius: 6px;
}

.btn:hover {
    background: #00adb5;
}

/* Footer */
footer {
    background: #1e1e1e;
    color: white;
    text-align: center;
    padding: 15px;
    margin-top: 20px;
}

/* Animation */
.fade-in {
    opacity: 0;
    transform: translateY(40px);
    transition: all 1s ease;
}

.fade-in.show {
    opacity: 1;
    transform: translateY(0);
}
</style>
</head>

<body>

<header>
    <h1>My Projects</h1>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="projects.html">Projects</a>
    <a href="#">Contact</a>
</nav>

<h2 class="title fade-in">My Work</h2>

<div class="projects">

    <div class="card fade-in">
        <img src="/images /p.jpg" alt="Project 1">
        <h3>Portfolio Website</h3>
        <p>A simple personal portfolio using HTML & CSS.</p>
        <a href="#" class="btn">View</a>
    </div>

    <div class="card fade-in">
        <img src="/images /h.jpg" alt="Project 2">
        <h3>Python Project</h3>
        <p>A beginner Python project for learning basics.</p>
        <a href="#" class="btn">View</a>
    </div>

</div>

<footer>
    <p>© 2026 MANIKANDAN</p>
</footer>

<script>
const elements = document.querySelectorAll('.fade-in');

function showOnScroll() {
    elements.forEach(el => {
        const top = el.getBoundingClientRect().top;
        const windowHeight = window.innerHeight;

        if (top < windowHeight - 50) {
            el.classList.add('show');
        }
    });
}

window.addEventListener('scroll', showOnScroll);
showOnScroll();
</script>

</body>
</html>
